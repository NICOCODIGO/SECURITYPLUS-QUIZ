spring.application.name=secplus-api

# Datasource.
#
# Locally these defaults are overridden by spring-boot-docker-compose, which
# reads compose.yaml, starts Postgres and injects the real host and port —
# so `./gradlew bootRun` needs no setup beyond a running Docker daemon.
# In a deployed environment the env vars are supplied from SSM Parameter Store.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/secplus}
spring.datasource.username=${DB_USER:secplus}
spring.datasource.password=${DB_PASSWORD:secplus}

# Flyway owns the schema. Hibernate only checks that its entities match what
# the migrations produced, and is never allowed to write DDL of its own.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# DynamoDB holds in-progress exam sessions only. Empty endpoint means "use the
# real AWS endpoint for the configured region"; local dev points at
# dynamodb-local from compose.yaml.
app.dynamodb.endpoint=${DYNAMODB_ENDPOINT:http://localhost:8000}
app.dynamodb.region=${AWS_REGION:us-east-1}
app.dynamodb.exam-sessions-table=${DYNAMODB_EXAM_SESSIONS_TABLE:exam_sessions}

# The front end's dev server. Comma-separated; the deployed origin is added
# through the env var rather than hardcoded.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Auth.
#
# A blank secret makes the app generate a random key at startup, so `bootRun`
# needs no setup — sessions just don't survive a restart, and it logs a WARN
# saying so. A supplied secret under 32 bytes fails startup rather than
# quietly weakening every token.
app.auth.secret=${AUTH_JWT_SECRET:}
app.auth.issuer=secplus-api
app.auth.access-token-ttl=15m
app.auth.refresh-token-ttl=30d

# The refresh cookie. SameSite=Strict holds as long as the API and the front
# end are same-site — true in dev (localhost:5173 -> localhost:8080) and true
# in production only if the API is routed under the same domain as the site.
# These are properties, not literals, so phase 6 is a config change.
app.auth.cookie-name=secplus_refresh
app.auth.cookie-path=/api/v1/auth
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Strict}
# Safari refuses Secure cookies on http://localhost, so dev defaults to false.
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}

# Only turn this on where every request arrives through a proxy that overwrites
# X-Forwarded-For. On a directly reachable origin it lets a caller choose their
# own rate-limit bucket, which is worse than not rate limiting at all.
app.auth.trust-forwarded-for=${AUTH_TRUST_FORWARDED_FOR:false}

# ApiExceptionHandler only catches ConstraintViolationException. Without this,
# a @Valid body failure returns Spring's default error shape instead of the
# RFC 7807 ProblemDetail the front end parses.
spring.mvc.problemdetails.enabled=true

# Mail. Empty host means "no mailer configured", which is the local default:
# Mailer logs what it would have sent instead of failing, so the whole auth
# flow is exercisable with no SES account and no network.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.from=${MAIL_FROM:no-reply@localhost}
# Links in emails have to point at the site, not at the API.
app.mail.base-url=${APP_BASE_URL:http://localhost:5173}

server.port=${PORT:8080}

# Operational surface. Only these endpoints are exposed; health details are
# hidden from anonymous callers so the probe cannot be used to fingerprint
# which downstream services are failing.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.health.probes.enabled=true

# Mail must NOT gate liveness, and this is not a preference.
#
# spring-boot-starter-mail contributes a health indicator that opens an SMTP
# connection. App Runner probes /actuator/health, so with it enabled: an empty
# MAIL_HOST reports DOWN and the container never becomes healthy at all, and a
# configured one makes a momentary SES blip look like a dead app and get a
# perfectly good container killed mid-deploy.
#
# Sending is best-effort by design — Mailer logs and swallows — so the app is
# emphatically still up when mail is not. QuestionApiTests caught this as a 503.
management.health.mail.enabled=false

# The request id comes from common/RequestIdFilter, which puts it in the MDC
# for the life of each request. Set as a pattern here so it applies to
# framework logs too, not just ours.
logging.pattern.level=%5p [${spring.application.name},%X{requestId:-}]

# JSON logging is deployed-only and lives in application-prod.properties, so
# a local terminal keeps readable plain text.
