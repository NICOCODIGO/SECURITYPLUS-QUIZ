# Deployed-only settings. Activated with SPRING_PROFILES_ACTIVE=prod, which the
# App Runner service sets; nothing here applies locally.

# CloudWatch Logs Insights can query JSON fields directly instead of regexing a
# message string, which is what makes the request id from RequestIdFilter
# actually useful for tracing one user's failing request.
#
# ECS format is emitted natively by Boot - no logstash encoder dependency and
# no logback-spring.xml to keep in sync. Plain text stays the default elsewhere
# because JSON in a local terminal is unreadable.
logging.structured.format.console=ecs

# The generated key in TokenConfig is a local-development convenience. In a
# deployed environment an unset secret means every container restart signs
# every user out, so fail to start instead of logging a WARN nobody reads.
app.auth.secret=${AUTH_JWT_SECRET}
